[qdrant]
# Embedded mode — no server to run. Omit this section entirely to use the
# default path (~/.local/share/recall/qdrant). Set host/port instead if you
# need concurrent access from multiple processes at once.
path = "~/.local/share/recall/qdrant"

[embedding]
model = "nomic-embed-text"
provider = "ollama"
ollama_host = "http://localhost:11434"

# projetos explícitos — path e collection customizados
[[projects]]
name = "mcx-companion"
path = "~/sources/mcx-companion/docs"
collection = "mcx-companion"
glob = "**/*.md"

# auto-discover — cada subdir de ~/sources vira uma collection
[[sources]]
root = "~/sources"
glob = "**/*.md"
exclude = [
  "node_modules",
  ".venv",
  "dist",
  "__pycache__",
  ".git",
  "recall",        # evita auto-indexar o próprio projeto recall
  "codecompanion-history",
  "bkp",
  "obsidian",
  "litellm",
  "opencode",
]

[[sources]]
root = "~/analysis"
glob = "**/*.md"
exclude = [
  "node_modules",
  ".venv",
  "dist",
  "__pycache__",
  ".git",
]
