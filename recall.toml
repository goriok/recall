[qdrant]
host = "localhost"
port = 6333

[embedding]
model = "nomic-embed-text"
provider = "ollama"
ollama_host = "http://localhost:11434"

# projetos explícitos — path e collection customizados
[[projects]]
name = "mcx-companion"
path = "~/sources/mcx-companion/docs"
collection = "mcx-companion"
glob = "**/*.md"

# auto-discover — cada subdir de ~/sources vira uma collection
[[sources]]
root = "~/sources"
glob = "**/*.md"
exclude = [
  "node_modules",
  ".venv",
  "dist",
  "__pycache__",
  ".git",
  "recall",        # evita auto-indexar o próprio projeto recall
  "codecompanion-history",
  "bkp",
  "obsidian",
  "litellm",
  "opencode",
]
