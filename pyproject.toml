[project]
name = "recall"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "python-dotenv>=1.0",
    "qdrant-client>=1.9",
    "ollama>=0.2",
    "httpx>=0.27",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
recall = "recall.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["src/recall"]
omit = ["src/recall/cli.py"]

[tool.coverage.report]
fail_under = 90

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]
