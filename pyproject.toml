[project]
name = "recall"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "python-dotenv>=1.0",
    "qdrant-client>=1.9",
    "ollama>=0.2",
    "httpx>=0.27",
    "mcp>=1.0",
    "tomli>=2.0; python_version < '3.11'",
    "croniter>=6.2.2",
]

[project.scripts]
recall = "recall.cli:app"
recall-mcp = "recall.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/recall"]
omit = ["src/recall/cli.py"]

[tool.coverage.report]
fail_under = 90

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=5",
]
