[project]
name = "recall"
version = "0.6.0"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "python-dotenv>=1.0",
    "qdrant-client>=1.9",
    "ollama>=0.2",
    "httpx>=0.27",
    "mcp>=1.0,<2",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
recall = "recall.cli:app"
recall-mcp = "recall.mcp_server:main"

[project.optional-dependencies]
code = [
    "tree-sitter-go>=0.23",
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-rust>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -m 'not integration and not remote'"
markers = [
    "integration: needs a running Qdrant server (RECALL_TEST_QDRANT_URL)",
    "remote: needs an OpenAI-compatible embeddings endpoint (RECALL_TEST_EMBEDDING_URL, RECALL_EMBEDDING_API_KEY)",
]

[tool.coverage.run]
source = ["src/recall"]
omit = ["src/recall/cli.py"]

[tool.coverage.report]
fail_under = 90

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "tree-sitter-go>=0.23",
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-rust>=0.23",
]
